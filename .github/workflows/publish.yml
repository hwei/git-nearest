name: publish

# Push a tag like v0.1.0 to build and upload to PyPI via Trusted Publishing (no stored token).
on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: false
      - name: Check the tag matches both version strings
        run: |
          version=$(grep -m1 '^version' pyproject.toml | cut -d'"' -f2)
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME != pyproject $version"; exit 1; }
          grep -q "__version__ = \"$version\"" src/git_nearest/__init__.py || { echo "__init__.py version differs"; exit 1; }
      - run: uv run pytest -q
      - run: uv build
      - run: uv publish
